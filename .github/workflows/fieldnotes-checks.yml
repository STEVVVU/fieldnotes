name: Fieldnotes checks

on:
  push:
    branches: [fieldnotes]
  pull_request:
    branches: [fieldnotes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web-clipper test --run --coverage
      - run: pnpm --filter server test --run src/routes/api/evidence.spec.ts src/routes/api/clipper.spec.ts
      - run: pnpm typecheck
      - run: pnpm --filter web-clipper build
      - run: pnpm --filter web-clipper build:firefox
      - run: node tools/verify-fieldnotes-server.mjs ci-${{ github.run_id }} 8097 --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fieldnotes-verification
          path: |
            .audit/verification/*/result.json
            .audit/verification/*/server.log

  native-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @triliumnext/desktop build
      - name: Verify the real native renderer and restart
        env:
          DEBUG: pw:browser
        run: |
          mkdir -p .audit/verification/native-${{ github.run_id }}
          set -o pipefail
          xvfb-run -a node tools/verify-fieldnotes-native.mjs native-${{ github.run_id }} 2>&1 | tee .audit/verification/native-${{ github.run_id }}/launch.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fieldnotes-native-evidence
          path: |
            .audit/verification/*/native-result.json
            .audit/verification/*/desktop.log
            .audit/verification/*/launch.log
            .audit/verification/*/*.png
            .audit/verification/*/*.html
          retention-days: 7
